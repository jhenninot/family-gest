version: 2
updates:
  # Frontend (Vue 3 / Vite, à la racine du dépôt)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Backend (Express / Mongoose, dans server/)
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Actions GitHub (build & publish de l'image Docker)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
